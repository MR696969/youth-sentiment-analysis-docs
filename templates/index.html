<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youth Sentiment Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .platform-icon {
            font-size: 2em;
            margin-right: 10px;
        }
        .card { 
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        .results-container {
            display: none;
        }
        .sentiment-chart {
            height: 300px;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .platform-select {
            margin-right: 10px;
        }
    </style>
    <!-- Facebook SDK -->
    <script>
        window.fbAsyncInit = function() {
            FB.init({
                appId      : '{your-app-id}',
                cookie     : true,
                xfbml      : true,
                version    : '{api-version}'
            });
            
            FB.AppEvents.logPageView();   
            
            // Check login status on page load
            FB.getLoginStatus(function(response) {
                statusChangeCallback(response);
            });
        };

        function statusChangeCallback(response) {
            if (response.status === 'connected') {
                // Logged into your app and Facebook
                console.log('Welcome! Fetching your information....');
                FB.api('/me', function(response) {
                    console.log('Good to see you, ' + response.name + '.');
                    // Enable the analysis form for logged-in users
                    document.getElementById('analysisForm').style.display = 'block';
                });
            } else if (response.status === 'not_authorized') {
                // The person is logged into Facebook, but not your app
                console.log('Please log into this app.');
                showLoginButton();
            } else {
                // The person is not logged into Facebook
                console.log('Please log into Facebook.');
                showLoginButton();
            }
        }

        function showLoginButton() {
            // Hide the analysis form for non-logged-in users
            document.getElementById('analysisForm').style.display = 'none';
            
            // Create and show login button
            const loginContainer = document.createElement('div');
            loginContainer.id = 'fb-login-container';
            loginContainer.innerHTML = `
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Login Required</h5>
                        <p>Please login with Facebook to use the sentiment analysis tool.</p>
                        <div class="fb-login-button" 
                             data-scope="public_profile,email"
                             data-button-type="continue_with"
                             data-size="large"
                             data-auto-logout-link="true"
                             data-use-continue-as="true">
                        </div>
                    </div>
                </div>
            `;
            document.querySelector('.container').insertBefore(loginContainer, document.querySelector('.card'));
        }

        (function(d, s, id){
            var js, fjs = d.getElementsByTagName(s)[0];
            if (d.getElementById(id)) {return;}
            js = d.createElement(s); js.id = id;
            js.src = "https://connect.facebook.net/en_US/sdk.js";
            fjs.parentNode.insertBefore(js, fjs);
        }(document, 'script', 'facebook-jssdk'));
    </script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-chart-bar"></i>
                Youth Sentiment Analysis
            </a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Analyze Social Media Sentiment</h5>
                        <form id="analysisForm" class="mt-3">
                            <div class="mb-3">
                                <label for="query" class="form-label">Search Query</label>
                                <input type="text" class="form-control" id="query" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Select Platforms</label>
                                <div class="d-flex flex-wrap">
                                    <div class="form-check platform-select">
                                        <input class="form-check-input" type="checkbox" value="twitter" id="twitter">
                                        <label class="form-check-label" for="twitter">
                                            <i class="fab fa-twitter text-info"></i> Twitter
                                        </label>
                            </div>
                                    <div class="form-check platform-select">
                                        <input class="form-check-input" type="checkbox" value="reddit" id="reddit">
                                        <label class="form-check-label" for="reddit">
                                            <i class="fab fa-reddit text-danger"></i> Reddit
                                        </label>
                        </div>
                                    <div class="form-check platform-select">
                                        <input class="form-check-input" type="checkbox" value="facebook" id="facebook">
                                        <label class="form-check-label" for="facebook">
                                            <i class="fab fa-facebook text-primary"></i> Facebook
                                        </label>
                                        </div>
                                    <div class="form-check platform-select">
                                        <input class="form-check-input" type="checkbox" value="instagram" id="instagram">
                                        <label class="form-check-label" for="instagram">
                                            <i class="fab fa-instagram text-danger"></i> Instagram
                                        </label>
                                    </div>
                                    <div class="form-check platform-select">
                                        <input class="form-check-input" type="checkbox" value="youtube" id="youtube">
                                        <label class="form-check-label" for="youtube">
                                            <i class="fab fa-youtube text-danger"></i> YouTube
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="limit" class="form-label">Posts per Platform</label>
                                <input type="number" class="form-control" id="limit" value="50" min="1" max="100">
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-search"></i> Analyze
                            </button>
                        </form>
                    </div>
                </div>
            </div>
                            </div>

        <div class="loading">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
            <p class="mt-2">Analyzing social media sentiment...</p>
                        </div>

        <div class="results-container">
                            <div class="row">
                <div class="col-md-12">
                                        <div class="card">
                                            <div class="card-body">
                            <h5 class="card-title">Analysis Results</h5>
                            <div id="resultsContent"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        document.getElementById('analysisForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
            const query = document.getElementById('query').value;
            const limit = document.getElementById('limit').value;
            const platforms = Array.from(document.querySelectorAll('input[type="checkbox"]:checked')).map(cb => cb.value);
            
            if (platforms.length === 0) {
                alert('Please select at least one platform');
                return;
            }

            document.querySelector('.loading').style.display = 'block';
            document.querySelector('.results-container').style.display = 'none';

            try {
                const response = await fetch('/analyze_multi_platform', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query,
                        platforms,
                        limit: parseInt(limit)
                    }),
                });
                            
                const data = await response.json();
                
                if (data.success) {
                    displayResults(data);
                        } else {
                    alert('Error: ' + data.error);
                        }
            } catch (error) {
                alert('Error analyzing sentiment: ' + error.message);
            } finally {
                document.querySelector('.loading').style.display = 'none';
                    }
                });

        function displayResults(data) {
            const resultsContainer = document.querySelector('.results-container');
            const resultsContent = document.getElementById('resultsContent');
            resultsContent.innerHTML = '';

            Object.entries(data.results).forEach(([platform, results]) => {
                if (results.error) {
                    resultsContent.innerHTML += `
                        <div class="alert alert-danger">
                            Error analyzing ${platform}: ${results.error}
                        </div>
                    `;
                    return;
                }
                
                const chartId = `chart-${platform}`;
                resultsContent.innerHTML += `
                    <div class="card mb-4">
                        <div class="card-header">
                            <i class="fab fa-${platform} platform-icon"></i>
                            ${platform.charAt(0).toUpperCase() + platform.slice(1)}
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <canvas id="${chartId}" class="sentiment-chart"></canvas>
                                </div>
                                <div class="col-md-6">
                                    <h6>Statistics</h6>
                                    <p>Total Posts: ${results.total_posts}</p>
                                    <p>Average Sentiment: ${results.average_sentiment.toFixed(2)}</p>
                                    <p>Confidence: ${(results.average_confidence * 100).toFixed(1)}%</p>
                                    
                                    <h6 class="mt-4">Sample Posts</h6>
                                    <div class="sample-posts" style="max-height: 200px; overflow-y: auto;">
                                        ${results.sample_posts.map(post => `
                                            <div class="border-bottom py-2">
                                                <small class="text-muted">@${post.author || 'anonymous'}</small>
                                                <p class="mb-1">${post.original_text}</p>
                                                <span class="badge bg-${getSentimentBadgeColor(post.overall_sentiment)}">
                                                    ${post.overall_sentiment}
                                                </span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                const ctx = document.getElementById(chartId).getContext('2d');
                new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: ['Positive', 'Neutral', 'Negative'],
                        datasets: [{
                            data: [
                                results.sentiment_distribution.positive,
                                results.sentiment_distribution.neutral,
                                results.sentiment_distribution.negative
                            ],
                            backgroundColor: ['#28a745', '#ffc107', '#dc3545']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false
                    }
                });
            });

            resultsContainer.style.display = 'block';
        }

        function getSentimentBadgeColor(sentiment) {
            switch (sentiment.toLowerCase()) {
                case 'positive': return 'success';
                case 'negative': return 'danger';
                default: return 'warning';
                }
        }
    </script>
</body>
</html>
